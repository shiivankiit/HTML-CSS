<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Twitter text box</title>
    <style>
      img {
        width: 50px;
        height: 50px;
        border-radius: 25px;
        vertical-align: middle;
        object-fit: cover;
        margin-right: 10px;
      }
      .text {
        font-size: 18px;
        border: none;
        width: 300px;
        vertical-align: middle;
      }
      .btn {
        background-color: rgb(29, 155, 240);
        color: white;
        border: none;
        padding-top: 8px;
        padding-bottom: 8px;
        padding-left: 16px;
        padding-right: 16px;
        border-radius: 30px;
        font-size: 16px;
        font-weight: bold;
        vertical-align: middle;
      }
    </style>
  </head>
  <body>
    <img src="car.avif" alt="car_img" />
    <input class="text" type="text" placeholder="What's happening">
    <button class="btn">Tweet</button>
  </body>
</html>
