<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linkedin signup</title>
    <style>
        p{
            font-family: Arial;
        }
        .text1{
            color: gray;
            margin-top: 0;

        }
        input{
            border-width: 2px;
            border-radius: 4px;
            border-style: solid;

        .disc{

            width: 4000px;
        }
        .btn{

           padding-left: 50px;
           padding-right: 50px;

           width: 300px;
           border: none;
           background-color: rgb(0, 145, 255);

           font-weight: bold;
           font-size: 17px;
           
        }
    </style>
</head>
<body>
    <p class="text1">Email</p>
    <input type="text">
    <p class="disc">By clicking Agree & Join,you agree to the Privacy Policy</p>
    <button class="btn">Agree & Join</button>

</html>
