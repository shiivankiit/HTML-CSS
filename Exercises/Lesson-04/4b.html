<!-- Difference between Transform and Transition -->
<!-- 
CSS Transform:-It modifies the shape and position of an element 
in 2D or 3D space.Common function include

rotate(angle):-Spins the element(eg.rotate(45deg)).
scale(x,y):-Resizes the element(e.g,scale(1.5)makes it 50% larger).
translate(x,y):Moves the element from its current position(e.g..translate(20px,50px)).
skew(x,y):Tilts the element along its axes

--------------------------------------------------------------------------------------------
CSS Transition:The transition property allows you to change property
values smoothly over a given duration.It is typically triggered by a 
state change like :hover or :focus

A transition is made up four sub-properties.

1--transition-property:The name of the property you want to
animate(e.g transform,background-color,all)
2--transition-duration:How long the animation lasts(e.g..0.3s)
3--transition-timing-function:The "speed curve" of the animation
(e.g..,ease,linear,ease-in-out).
4--transition-delay:How long to wait before the animation starts.
-->



<!--CSS Box-Model-->
<!-- The css box-shadow property is used to apply one or more 
 shadows to an element.
 -You can only specify the horizontal and the vertical offset of the
 shadow.
 CSS Horizontal and Vertical Shadow:
 You only specify the horizontal and the vertical offset of the shadow.
 The default color of the shadow is hte current text color.
 Example:Specify a horizontal and a vertical shadow.
        div{
        box-shadow:10px 10px;
        }
 Specify a Color of the Shadow.
 The color parameter defines the color of the shadow.
 Example:-Specify a color for the shadow.
 div{
     box-shadow:10px 10px lightblue;
 }
 //Add a blur effect to the shadow.(5px)
 div{
 box-shadow:10px 10px 5px lightblue
 }
 You can also add inset,spread radius of the Shadow
 and many more to it.
 
-->
