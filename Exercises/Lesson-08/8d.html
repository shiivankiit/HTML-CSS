<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up form</title>
    <style>
        .btn1{
            width: 100px;
            padding:8px 10px 10px 15px;
            border-radius: 4px;
            border-style: solid;
            border-color: (200,200,200);
            border-width: 1px;
        }
        .btn2{
            width: 100px;
            padding:8px 10px 10px 15px;
            border-radius: 4px;
            border-style: solid;
            border-color: (200,200,200);
            border-width: 1px;
        }
        .btn3{

        .btn4{
            width: 257px;

            border: none;

        }

</head>
<body>
   <input class="btn1" type="text" placeholder="First name">
