<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uber request-a-ride form</title>
    <style>
        .heading{
            font-size: 25px;
            font-family: Arial;
            font-weight: 500;
            margin-top: 0;
            margin-bottom: 15px;
        }
        input{
            display: block;
            width: 400px;
            padding:10px 20px 10px 10px;
            margin-bottom: 10px;
            background-color: rgb(240,240,240);
            border: none;
        }
        .btn1{
            font-size: 15px;
            padding: 10px 10px 10px 10px;
            background-color: black;
            color: white;
            border:none;
            margin-right: 10px;
        }
        .btn2{
            font-size: 15px;
            padding: 10px 10px 10px 10px;
            background-color: rgb(240,240,240);
            color: black;
            border:none;
            margin-right: 10px;
        }
        
    </style>
</head>
<body>
    <p class="heading">Request a ride now</p>
    <input  type="text" placeholder="Enter pickup location">
    <input type="text" placeholder="Enter destination">
    <button class="btn1">Request now</button>
    <button class="btn2">Schedule for later</button>
</body>
</html>
