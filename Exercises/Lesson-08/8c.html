<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Google</title>
    <style>
      img {
        display: block;
        width: 200px;
        margin-left: 150px;
        margin-bottom: 10px;
      }
      .google {
        font-size: 16px;
        width: 500px;
        padding-top: 10px;
        padding-bottom: 10px;
        padding-left: 10px;
        padding-right: 10px;
        border-radius: 30px;
        border: none;
        box-shadow: 5px 5px 8px rgba(0,0,0,0.2);
      }
    </style>
  </head>
  <body>
    <img src="download.png" alt="Google" />
    <input
      class="google"
      type="text"
      placeholder="Search Google or type a URL"
    />
  </body>
</html>
