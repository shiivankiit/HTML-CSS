<html>
  <head>
    <title>Position Absolute and Relative</title>
    <style>
      body {
        height: 3000px;
      }
      .square {
        position: fixed;
        width: 200px;
        height: 100px;
        background-color: gray;
        bottom: 0;
        right: 0;
      }
      .twitter {
        position: absolute;
        top: -15px;
        left: -15px;
        background-color: black;
        color: white;
        width: 40px;
        height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50px;
        font-family: Arial;
        font-size: 20px;
      }
    </style>
  </head>
  <body>
    <div class="square">
      <div class="twitter">X</div>
    </div>
  </body>
</html>
