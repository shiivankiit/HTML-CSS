<html>
    <head>
        <title>Position-Fixed</title>
        <style>
            body{
                height: 3000px;
            }
            .sidebar{
                position: fixed;
                top: 0;
                right: 0;
                bottom: 0;
                background-color: green;
                width: 100px;
                
            }
            .entire-page{
                position: fixed;
                top: 0;
                right: 0;
                bottom: 0;
                left: 0;
                background-color: rgba(0,0,0,0.6);
                display: flex;
                justify-content: center;
                align-items: center;
            }
            .mid-div{
                width: 300px;
                background-color: white;
                border: 1px solid gray;
                overflow: hidden;
                border-radius: 10px;
                padding:10px 10px 10px 10px;
            }
            div{
                font-family: Arial;
                margin-top: 0;
                margin-bottom: 0;
            }
            .head{
                font-size: 20px;
                font-weight: bold;
                line-height: 40px;
            }
            button{
                margin-top: 10px;
                margin-bottom: 20px;
                background-color: rgb(175, 175, 175);
                border-radius: 3px;
                border: 2px solid rgb(101, 100, 100);
            }
        </style>
    </head>
    <body>
        <div class="sidebar">right sidebar</div>
        <div class="entire-page">
             <div class="mid-div">
                <div class="head">Modal Title</div>
                <div>This is a modal</div>
                <button>
                    Close
                </button>
             </div>
        </div>
       

        </div>
    </body>
</html>
