<html>
  <head>
    <title>Facebook-Header</title>
  </head>
  <style>
    body {
      height: 3000px;
    }
    .header {
      width: 500px;
      height: 50px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: fixed;
    }
    img {
      width: 40px;
      height: 40px;
      border-radius: 50px;
      object-fit: cover;
      margin-right: 5px;
    }
    .left-section {
      display: flex;
      align-items: center;
      margin-left: 10px;
    }
    .user-name {
      font-weight: bold;
      font-family: Arial;
    }
    .right-section {
      margin-right: 10px;
    }
    .btn1 {
      background-color: rgb(24, 119, 242);
      color: white;
      font-weight: bold;
      border: none;
      padding-top: 8px;
      padding-bottom: 8px;
      padding-left: 12px;
      padding-right: 12px;
      border-radius: 6px;
      margin-right: 3px;
    }
    .btn2 {
      background-color: rgb(230, 230, 230);
      border: none;
      font-weight: bold;
      padding-top: 8px;
      padding-bottom: 8px;
      padding-left: 12px;
      padding-right: 12px;
      border-radius: 6px;
    }
  </style>
  <body>
    <div class="header">
      <div class="left-section">
        <img src="cat2.jpg" alt="" />
        <div class="user-name">Oliver cat</div>
      </div>
      <div class="right-section">
        <button class="btn1">Add Friend</button>
        <button class="btn2">Message</button>
      </div>
    </div>
  </body>
</html>
