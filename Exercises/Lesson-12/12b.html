<!-- A flexbox with 3 items.widths=50px|remaining space
 75px -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice</title>
    <style>
        .main{
            display: flex;
        }
    </style>
</head>
<body>
    <div class="main">
      <div style="background-color: lightblue; width:50px">item1</div>
      <div style="background-color: lightpink; flex: 1;">item2</div>
      <div style="background-color: lightblue; width:75px">item3</div>
    </div>
</body>
</html>
