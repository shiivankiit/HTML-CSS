<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image-cart</title>
    <style>
      p {
        font-family: Arial;
        margin-top: 0;
        margin-bottom: 0;
      }
      .main {
        display: flex;
        flex-direction: row;
        align-items: center;
        margin-bottom: 20px;
      }
      img {
        width: 50px;
        height: 50px;
        border-radius: 50px;
        margin-right: 15px;
        object-fit: cover;
      }
      .text {
        width: 200px;
      }
      .top {
        font-weight: bold;
        margin-bottom: 3px;
      }
      .mid {
        color: gray;
        margin-bottom: 5px;
      }
      .bottom {
        color: rgb(150, 150, 150);
        font-size: 14px;
      }
      button {
        background-color: rgb(29, 155, 240);
        color: white;
        border: none;
        font-size: 16px;
        font-weight: bold;
        padding-top: 10px;
        padding-bottom: 10px;
        padding-left: 15px;
        padding-right: 15px;
        border-radius: 4px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="main">
      <img src="cat2.jpg" alt="cat-image" />
      <div class="text">
        <p class="top">oliver</p>
        <p class="mid">the cat</p>
        <p class="bottom">Popular</p>
      </div>
      <button>Follow</button>
    </div>

        <div class="main">
      <img src="cat2.jpg" alt="cat-image" />
      <div class="text">
        <p class="top">Mimi</p>
        <p class="mid">sleepy cat</p>
        <p class="bottom">Popular</p>
      </div>
      <button>Follow</button>
    </div>

        <div class="main">
      <img src="cat2.jpg" alt="cat-image" />
      <div class="text">
        <p class="top">Rex</p>
        <p class="mid">Happy Buldog</p>
        <p class="bottom">Popular</p>
      </div>
      <button>Follow</button>
    </div>
  </body>
</html>
