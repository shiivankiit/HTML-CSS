<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flex-Box</title>
    <style>
      .main {
        width: 500px;
        height: 38px;
        border: 1px solid black;
        background-color: rgb(78, 54, 171);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .text {
        color: white;
        font-family: Arial;
        font-weight: bold;
        font-size: 14px;
        margin-left: 10px;
      }
      input {
        width: 300px;
        border-radius: 10px;
        border: none;
        padding-left: 10px;
        height: 20px;
      }
      .btn {
        margin-right: 10px;
        padding-top: 5px;
        padding-right: 10px;
        padding-bottom: 5px;
        padding-left: 10px;
        background-color: rgb(78, 54, 171);
        color: white;
        border: 1px solid;
        border-radius: 2px;
      }
    </style>
  </head>
  <body>
    <div class="main">
      <div class="text">Home</div>

      <input type="text" placeholder="Search" />

      <div>
        <button class="btn">Download</button>
      </div>
    </div>
  </body>
</html>
