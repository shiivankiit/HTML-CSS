<!-- Create a flexbox with 2 items.width=200px|75px -->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flex-box--Exercise</title>
    <style>
      .main {
        display: flex;
      }
    </style>
  </head>
  <body>
    <div class="main">
      <div style="background-color: lightblue; width: 200px">200px</div>
      <div style="background-color: lightpink; width: 75px">75px</div>
    </div>
  </body>
</html>
