<head>

    <title>Image cart</title>
    <style>
        .main{
            width: 150px;
            box-shadow: 5px 5px 10px rgba(0,0,0,0.3);
            display: inline-block;
            margin-right: 15px;
        }
        img{
            width: 150px;
            height: 150px;
            object-fit: cover;
            margin-bottom: 12px;
        }
        .p1{

        }

            margin-bottom: 0;
        }
        button{
            margin-top: 8px;
            margin-left: 10px;
            color: white;
            background-color: rgb(18, 115, 234);
            border: none;
            border-radius: 3px;
            padding: 5px 8px 5px 8px;
        }
    </style>
</head>
