<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Google-style</title>
    <style>
      .main {
        text-align: center;
      }

      img {
        width: 200px;
        margin-top: 10px;
        margin-bottom: 10px;
      }

      input {
        border: none;
        padding-top: 12px;
        padding-bottom: 12px;
        padding-left: 16px;
        padding-right: 16px;
        font-size: 16px;
        width: 500px;
        border-radius: 30px;
        box-shadow: 0 1px 6px rgba(0, 0, 0, 0.2);
        margin-bottom: 30px;
      }

      button {
        background-color: rgb(245, 245, 245);
        border: none;
        font-size: 15px;
        padding-top: 12px;
        padding-bottom: 12px;
        padding-left: 20px;
        padding-right: 20px;
      }
    </style>
  </head>
  <body>
    <div class="main">
      <img src="download.png" alt="googleImage" />
      <input type="text" placeholder="Serach Google or type a URL" />
      <button>Google Serach</button>
      <button>I'm Feeling Lucky</button>
    </div>
  </body>
</html>
