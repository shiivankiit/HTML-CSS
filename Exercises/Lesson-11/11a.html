<!-- Create a grid with 2 columns with widths of 200px and 75px -->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title><CSS-Grid></CSS-Grid></title>
    <style>
        .grid{
            display: grid;
            grid-template-columns: 200px 75px;
        }
    </style>
  </head>
  <body>
    <div class="grid">
      <div style="background-color: orange;">200px</div>
      <div style="background-color: antiquewhite;">75px</div>
    </div>
  </body>
</html>
