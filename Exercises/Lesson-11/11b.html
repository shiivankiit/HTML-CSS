<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS-Grid</title>
    <style>
        .main{
            display: grid;
            grid-template-columns: 50px 1fr 75px;
        }
    </style>
</head>
<body>
    <div class="main">
        <div style="background-color: cadetblue;">col1</div>
        <div style="background-color: chartreuse;">col2</div>
        <div style="background-color: blueviolet;">col3</div>
    </div>
</body>
</html>
