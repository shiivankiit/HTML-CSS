<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Twitter-Post</title>
    <style>
        div{
            font-family: Arial;
            margin-top: 0;
            margin-bottom: 0;
        }
        img{
            width: 50px;
            height: 50px;
            border-radius: 50px;
            object-fit: cover;
        }
        .container{
            display: flex;
            flex-direction: row;
            width: 420px;
            margin-top: 10px;
            margin-left: 20px;
        }
        .left{
            margin-left: 10px;
        }
        .right{
            margin-left: 20px;
        }
        .top{
            display: flex;
        }
        .tweet-content{
            margin-top: 10px;
        }
        .bottom{
          display: flex;
          flex-direction: row;
          align-items: center;
          border: 1px solid gray;
          border-radius: 15px;
          overflow: hidden;
          margin-top: 10px;
        }
        .thumbnail-column{
            width: 200px;
            height: 100px;
            border: 1px solid gray;
            overflow: hidden;
            background-color: rgb(203, 201, 201);
            
        }
        .content{
            margin-left: 20px;
        }
        .channel{
            color: gray;
            margin-bottom: 5px;
            font-weight: 200;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="left">
            <img src="cat2.jpg" alt="">
        </div>
        <div class="right">
            <div class="top">
                <div class="id">supersimple.dev</div>
                <div class="mail">@SuperSimpleDev</div>
            </div>
           
                <div class="tweet-content">
                    What is backend web development?A complete overview.New video is up!
                </div>
        
            <div class="bottom">
                <div class="thumbnail-column"></div>
                <div class="content">
                    <div class="channel">youtube.com</div>
                    <div class="rdmp">Backend web development-a complete overview(2021)</div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
