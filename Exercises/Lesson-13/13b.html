<html>
    <head>
        <style>
           .flexbox{
            display: flex;
            flex-direction: row;
            height: 50px;
           }
           .box1{
            background-color: lightpink;
            width: 100px;
           }
           .box2{
            background-color: lightblue;
            width:200px;
           }
           .middle{
            display: flex;
            justify-content: space-between;
           }
           .row2{
            background-color: black;
            color: white;
           }
           .row3{
            background-color: black;
            color: white;
           }
        </style>
    </head>
    <body>
       <div class="flexbox">
          <div class="box1"></div>
          <div class="box2">
            <div>row1</div>
            <div class="middle">
               <div class="row2">row2</div>
               <div class="row3">row3</div>
            </div>
          </div>
       </div>
    </body>
</html>
