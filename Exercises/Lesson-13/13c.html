<html>
  <head>
    <style>
        div{
            font-family: Arial;
        }
      .main {
        width: 400px;
        padding: 10px 10px 10px 10px;
        box-shadow: 4px 4px 5px rgba(0, 0, 0, 0.2);
        border-radius: 5px;
        margin-top: 40px;
        margin-left: 20px;
      }
      .TOP {
        font-family: Arial;
        font-size: 12px;
        color: gray;
        margin-bottom: 30px;
      }
      img {
        width: 50px;
        height: 50px;
        border-radius: 50px;
        object-fit: cover;
      }
      .middle {
        display: flex;
        align-items: center;
        margin-bottom: 40px;
      }
      .email-content{
        display: flex;
        flex-direction: column;
        margin-left: 10px;
      }
      .heading{
        display: flex;
        justify-content: space-between;
        margin-bottom: 5px;
      }
      .text-1{
        font-weight: bold;
      }
      .mid{
        font-weight: bold;
      }
      .message{
        color: gray;
      }
      .text-2{
        color: gray;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div class="main">
      <div class="TOP">ALL INBOXES</div>
      <div class="middle">
        <div class="profile-picture">
          <img src="cat2.jpg" alt="Profile picture of a cat" />
        </div>
        <div class="email-content">
          <div class="heading">
            <div class="text-1">Chewy Promotions</div>
            <div class="text-2">4:58PM</div>
          </div>
          <div class="mid">Biggest sales of the year!</div>
          <div class="message">
            Hey there! We're writing to tell you about our...
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
