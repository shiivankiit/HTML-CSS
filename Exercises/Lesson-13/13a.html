<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nested-Flexbox</title>
    <style>
        .flexbox{
            display: flex;
            height: 50px;
            flex-direction: row;
        }
        .column1{
            background-color: lightpink;
            width: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .item{
            background-color: black;
            color: white;
            font-weight: bold;
        }
        .column2{
            background-color: lightblue;
            width: 200px;
        }
    </style>
</head>
<body>
    <div class="flexbox">
       <div class="column1">
        <div class="item">item1</div>
       </div>
       <div class="column2"></div>
    </div>
</body>
</html>
