<!-- Nested Layouts Technique -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Youtube.com Clone</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <style>
        div{
            font-family: Roboto;
        }
      .thumbnail {
        width: 300px;
      }
      .search-bar {
        font-size: 20px;
        display: block;
      }
      .video-preview {
        width: 300px;
        display: inline-block;
        vertical-align: top;
        margin-right: 15px;
      }
      .channel-picture{
        display: inline-block;
        width: 50px;
        vertical-align: top;
      }
      .video-info{
        display: inline-block;
        width: 200px;
      }
      .profile-picture{
        border-radius: 50px;
        width: 40px;
      }
      .video-title{
        margin-top: 0;
        font-size: 14px;
        font-weight: 500;
        line-height: 20px;
        margin-bottom: 0;
      }
      .video-author{
        font-size: 12px;
        color: gray;
        margin-bottom:0;
        margin-top: 6px;
      }
      .video-stats{
        font-size: 12px;
        color: gray;
        margin-top: 4px;
      }
      .thumbnail-row{
        margin-bottom: 10px;
      }
    </style>
  </head>
  <body>
    <input class="search-bar" type="text" placeholder="Search" />

    <div class="video-preview">
      <!-- Vertical Layouts -->
      <div class="thumbnail-row">
        <img class="thumbnail" src="Images/thumbnail-1.webp" alt="Image1" />
      </div>
      <div>
        <div class="channel-picture">
            <img class="profile-picture" src="Images/channel-1.jpeg" alt="profile-pic" />
        </div>
        <div class="video-info">
          <p class="video-title">
            Talking Tech and AI with Google CEO Sundar Pichai
          </p>
          <p class="video-author">Marques Brownlee</p>
          <p class="video-stats">3.4M views &#183; 6 months ago</p>
        </div>
      </div>
    </div>



     <div class="video-preview">
      <!-- Vertical Layouts -->
      <div class="thumbnail-row">
        <img class="thumbnail" src="Images/thumbnail-2.webp" alt="Image1" />
      </div>
      <div>
        <div class="channel-picture">
            <img class="profile-picture" src="Images/channel-2.jpeg" alt="profile-pic" />
        </div>
        <div class="video-info">
          <p class="video-title">
            Try Not To Laugh Challenge #9
          </p>
          <p class="video-author">Markiplier</p>
          <p class="video-stats">19M views &#183; 4 years ago</p>
        </div>
      </div>
    </div>
   
  </body>
</html>

<!-- 
Nested-Layouts Technique
1--Vertical Layouts.
2--Horizontal Layouts.
-->
