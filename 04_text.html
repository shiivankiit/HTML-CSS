<!-- 
Block elements always start on a new line and takes up full avlbl width
of their parent container.They allow you to set
explicit widht and height values,and margins/padding
are respected on all sides.
ex:p,h1 to h6,div,section.

Inline elements flow along with the text and do not
start on a new line,taking only as much width as
their content requires.You can not set width or height
on them and margin and paddings.

Inline-block elements combine behaviors from
both: they flow inline like text 
(sitting side-by-side with other elements) 
but allow you to set width, height, and full
margin/padding support.

-->
