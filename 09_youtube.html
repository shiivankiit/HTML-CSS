<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Youtube.com Clone</title>
    <style>
        .thumbnail{
            width:300px;
        }
        .search-bar{
            font-size: 20px;
            display: block;
        }
        .video-preview{
            width: 300px;
            display: inline-block;
            vertical-align: top;
            margin-right: 15px;
        }

    </style>
</head>
<body>
    <input class="search-bar"type="text" placeholder="Search">
    
    <div class="video-preview">
    <img class=" thumbnail" src="Images/thumbnail-1.webp" alt="Image1">
    <p class="video-title">Talking Tech <strong>and AI with</strong> Google CEO Sundar Pichai</p>
    <p class="video-author">Marques Brownlee</p>
    <p class="video-stats">3.4M views &#183; 6 months ago</p>
    </div>
      <div class="video-preview">
    <img class=" thumbnail" src="Images/thumbnail-2.webp" alt="Image1">
    <p class="video-title">Try Not To Laugh Challenge #9</p>

    </div>
</body>
</html>
